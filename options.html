<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>意图胶囊 · 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f7f8;
      color: #1a1a1a;
      padding: 32px;
      min-width: 520px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }
    .section { background: white; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
    .section-title { font-size: 12px; font-weight: 600; color: #E11D48; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%; padding: 9px 12px; border: 1px solid #e0e0e0;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #E11D48;
    }
    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field-hint { font-size: 12px; color: #aaa; margin-top: 4px; }
    .btn-row { display: flex; gap: 10px; margin-top: 24px; }
    button {
      padding: 9px 20px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-primary { background: #E11D48; color: white; }
    .btn-primary:hover { opacity: 0.9; }
    #status { font-size: 13px; color: #38a169; align-self: center; }
    .key-input-wrap { display: flex; gap: 8px; }
    .key-input-wrap input { flex: 1; }
    .toggle-btn { padding: 9px 14px; background: #f0f0f0; color: #555; font-size: 13px; flex-shrink: 0; }
    #key-hint { transition: color 0.2s; }
  </style>
</head>
<body>
  <h1>💊 意图胶囊</h1>
  <p class="subtitle">AI 对话上下文迁移工具 · 设置</p>

  <div class="section">
    <div class="section-title">DeepSeek API（AI 强化功能）</div>
    <div class="field">
      <label for="api-key">API Key</label>
      <div class="key-input-wrap">
        <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">
        <button class="toggle-btn" id="toggle-key">显示</button>
        <button class="toggle-btn" id="test-key">测试</button>
      </div>
      <p class="field-hint" id="key-hint">仅保存在本地，不上传任何服务器</p>
    </div>
    <div class="field">
      <label for="model">模型</label>
      <select id="model">
        <option value="deepseek-v4-pro">deepseek-v4-pro（推荐）</option>
        <option value="deepseek-v4-flash">deepseek-v4-flash（更快更省）</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">AI 重组 Prompt（高级）</div>
    <div class="field">
      <label for="enhance-prompt">自定义提示词</label>
      <textarea id="enhance-prompt" placeholder="留空使用内置提示词"></textarea>
      <p class="field-hint">留空即可，仅在需要调整 AI 行为时修改</p>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="save">保存设置</button>
    <span id="status"></span>
  </div>

  <script src="dist/options.js"></script>
</body>
</html>
